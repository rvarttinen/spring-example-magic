plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id "com.diffplug.eclipse.apt" version "4.4.1"
}

group = 'se.autocorrect'
version = '0.2.0-SNAPSHOT'

repositories {
    mavenCentral()
}

defaultTasks 'build'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {

    implementation 'org.apache.jena:apache-jena-libs:6.2.0'

    constraints {
        implementation('org.bouncycastle:bcprov-jdk18on:1.85') {
            because 'Fixes the reported Bouncy Castle vulnerabilities'
        }
        implementation('org.apache.commons:commons-lang3:3.18.0') {
            because 'Fixes the reported uncontrolled-recursion vulnerability'
        }
        implementation('org.apache.shiro:shiro-core:3.0.0') {
            because 'Fixes the reported remember-me cookie age vulnerability'
        }
        implementation('org.apache.shiro:shiro-web:3.0.0') {
            because 'Fixes the reported remember-me cookie age vulnerability'
        }
        implementation('org.apache.commons:commons-lang3:3.18.0') {
            because 'Fixes CVE-2025-48924'
        }
    }
    
    def springBootBom = platform("org.springframework.boot:spring-boot-dependencies:4.1.2")
    implementation springBootBom
    testImplementation springBootBom

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'

    #implementation 'org.apache.jena:apache-jena-libs:6.2.0'
    implementation 'org.apache.jena:jena-querybuilder:6.2.0'
    implementation 'org.apache.jena:jena-fuseki-main:6.2.0'

    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.22.4'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'com.google.guava:guava:33.8.0-jre'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")

    // Required for Mockito to work on JDK 25
    implementation 'net.bytebuddy:byte-buddy:1.18.17'

    // Some test annotations (MockBean, AutoConfigureMockMvc, etc.) are provided
    // by the following Spring Boot test modules. Dependabot or changes in the
    // dependency graph can sometimes cause these to be missing from the
    // test compile classpath — add them explicitly to ensure tests compile
    // in CI.
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
}

task fatJar(type: Jar) {
    manifest {
        attributes 'Main-Class': 'se.autocorrect.springexample.SpringExampleMagicApplication'
    }

    archiveBaseName = project.name + '-all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }

    with jar
}

test {
    jvmArgs(
        "-Dnet.bytebuddy.experimental=true",
        "-XX:+EnableDynamicAgentLoading"
    )
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs = [
        '-parameters',
        '--enable-preview',
        '-Xlint:all',
        '-Xlint:-unchecked',
        '-Xlint:-rawtypes'
    ]
    doFirst {
        println "Compiler args: ${options.compilerArgs}"
    }
}

compileJava {
    options.compilerArgs += [
        '-Amapstruct.suppressGeneratorTimestamp=true',
        '-Amapstruct.suppressGeneratorVersionInfoComment=true',
        '-Amapstruct.defaultComponentModel=spring'
    ]
}
